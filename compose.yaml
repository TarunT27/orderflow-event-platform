name: orderflow

services:
  orderflow:
    image: orderflow-platform:local
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${ORDERFLOW_PORT:-4000}:4000"
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATA_DIR: /app/data
      DEMO_MODE: "true"
      MAX_DELIVERY_ATTEMPTS: 3
    volumes:
      - orderflow-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  orderflow-data:
    name: orderflow-data
